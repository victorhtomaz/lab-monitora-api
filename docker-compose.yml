name: monitora_agro

services:
  influxdb:
    image: influxdb:2.9
    container_name: monitoraagro-influxdb
    environment:
      DOCKER_INFLUXDB_INIT_MODE: ${DOCKER_INFLUXDB_INIT_MODE}
      DOCKER_INFLUXDB_INIT_USERNAME: ${DOCKER_INFLUXDB_INIT_USERNAME}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${DOCKER_INFLUXDB_INIT_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${DOCKER_INFLUXDB_INIT_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${DOCKER_INFLUXDB_INIT_BUCKET}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_ADMIN_TOKEN}
    ports:
      - "8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    networks:
      - monitoraagro-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: src/MonitoraAgro.API/Dockerfile
    container_name: monitoraagro-api
    ports:
      - "${ASPNETCORE_HTTP_PORT}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_HTTP_PORTS: ${ASPNETCORE_HTTP_PORT}
      ConnectionStrings__DefaultConnection: ${ConnectionStrings__DefaultConnection}
      Settings__Jwt__SigningKey: ${Settings__Jwt__SigningKey}
      Settings__Jwt__ExpirationTimeInMinutes: ${Settings__Jwt__ExpirationTimeInMinutes}
      Settings__InfluxDB__Url: ${Settings__InfluxDB__Url}
      Settings__InfluxDB__Token: ${INFLUXDB_ADMIN_TOKEN}
      Settings__InfluxDB__Organization: ${Settings__InfluxDB__Organization}
      Settings__InfluxDB__Bucket: ${Settings__InfluxDB__Bucket}
      Settings__Firebase__ProjectId: ${Settings__Firebase__ProjectId}
      Settings__Firebase__CredentialFilePath: ${Settings__Firebase__CredentialFilePath}
    volumes:
      - ./firebase-credentials.json:${Settings__Firebase__CredentialFilePath}
    depends_on:
      influxdb:
        condition: service_healthy
    networks:
      - monitoraagro-network
    restart: unless-stopped

volumes:
  influxdb_data:
  influxdb_config:

networks:
  monitoraagro-network:
    driver: bridge
